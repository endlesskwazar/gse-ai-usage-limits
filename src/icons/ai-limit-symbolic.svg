<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
    <!-- Gauge Arc: Thin 1px line, strictly the top half -->
    <!-- Center 8,9. Radius 7. Starts at 1,9. Ends at 15,9. Top at 8,2. -->
    <path d="M 1 9 A 7 7 0 0 1 15 9" fill="none" stroke="#bebebe" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Robot Head: Small, solid, wide block at the bottom -->
    <!-- Positioned below the arc's center line to ensure separation -->
    <!-- x=4 to 12 (width 8), y=10 to 14 (height 4). -->
    <!-- Eyes are transparent cutouts -->
    <g fill="#bebebe">
        <path fill-rule="evenodd" d="
            M 4 11 H 12 V 15 H 4 V 11 Z
            M 5 12 H 7 V 13 H 5 V 12 Z
            M 9 12 H 11 V 13 H 9 V 12 Z
        "/>
        <!-- Antenna: Small vertical line connecting head to arc center (optional, but adds "robot" feel) -->
        <!-- Just a tiny blip -->
        <rect x="7" y="9" width="2" height="2"/>
    </g>
</svg>